<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="React to API to MongoDB flow">
  <rect width="900" height="260" fill="#f8fafc" />

  <rect x="40" y="60" width="210" height="90" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
  <text x="145" y="95" text-anchor="middle" font-family="Arial" font-size="14" fill="#0f172a">React Frontend</text>
  <text x="145" y="115" text-anchor="middle" font-family="Arial" font-size="12" fill="#0f172a">Vite App</text>

  <rect x="345" y="60" width="210" height="90" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text x="450" y="95" text-anchor="middle" font-family="Arial" font-size="14" fill="#0f172a">Node/Express API</text>
  <text x="450" y="115" text-anchor="middle" font-family="Arial" font-size="12" fill="#0f172a">REST Endpoints</text>

  <rect x="650" y="60" width="210" height="90" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2" />
  <text x="755" y="95" text-anchor="middle" font-family="Arial" font-size="14" fill="#0f172a">MongoDB Atlas</text>
  <text x="755" y="115" text-anchor="middle" font-family="Arial" font-size="12" fill="#0f172a">Cloud Database</text>

  <rect x="650" y="170" width="210" height="60" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
  <text x="755" y="205" text-anchor="middle" font-family="Arial" font-size="13" fill="#0f172a">MongoDB Compass</text>

  <line x1="250" y1="105" x2="345" y2="105" stroke="#0f172a" stroke-width="2" />
  <polygon points="345,105 335,100 335,110" fill="#0f172a" />

  <line x1="555" y1="105" x2="650" y2="105" stroke="#0f172a" stroke-width="2" />
  <polygon points="650,105 640,100 640,110" fill="#0f172a" />

  <line x1="755" y1="150" x2="755" y2="170" stroke="#0f172a" stroke-width="2" />
  <polygon points="755,170 750,160 760,160" fill="#0f172a" />

  <text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">
    HTTP requests and responses
  </text>
</svg>
