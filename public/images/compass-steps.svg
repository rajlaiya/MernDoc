<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Compass connection steps">
  <rect width="900" height="260" fill="#f8fafc" />

  <rect x="40" y="40" width="200" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text x="140" y="75" text-anchor="middle" font-family="Arial" font-size="13" fill="#0f172a">1) Install Compass</text>

  <rect x="260" y="40" width="200" height="60" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2" />
  <text x="360" y="75" text-anchor="middle" font-family="Arial" font-size="13" fill="#0f172a">2) Copy URI</text>

  <rect x="480" y="40" width="200" height="60" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2" />
  <text x="580" y="75" text-anchor="middle" font-family="Arial" font-size="13" fill="#0f172a">3) Paste in Compass</text>

  <rect x="700" y="40" width="160" height="60" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
  <text x="780" y="75" text-anchor="middle" font-family="Arial" font-size="13" fill="#0f172a">4) Connect</text>

  <rect x="170" y="150" width="220" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
  <text x="280" y="185" text-anchor="middle" font-family="Arial" font-size="13" fill="#0f172a">Create DB + Collection</text>

  <rect x="460" y="150" width="260" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
  <text x="590" y="185" text-anchor="middle" font-family="Arial" font-size="13" fill="#0f172a">Refresh to See Data</text>
</svg>
